[project]
name = "qgis-mcp"
version = "4.7.1"
description = "MCP server and QGIS plugin that let Claude and other AI agents drive QGIS, with a Data Explorer for live satellite imagery, weather, elevation and OpenStreetMap data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adil Munawar", email = "adilmunawarx@gmail.com" }]
requires-python = ">=3.10"
keywords = ["qgis", "mcp", "model-context-protocol", "gis", "geospatial", "claude", "pyqgis", "remote-sensing", "sentinel-2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
]

[project.urls]
Homepage = "https://github.com/adilmunawar/qgis_mcp"
Repository = "https://github.com/adilmunawar/qgis_mcp"
Issues = "https://github.com/adilmunawar/qgis_mcp/issues"

[project.scripts]
qgis-mcp = "qgis_mcp.qgis_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_mcp"]
