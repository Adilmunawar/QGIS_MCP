name: Feature request
description: Suggest a new tool, connector or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your GIS workflow and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the tool or behaviour look like?
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Expected risk category
      description: How risky would the new command be?
      options:
        - read
        - write
        - destructive
        - code
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this
