name: Bug report
description: Something in QGIS MCP is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do NOT use this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server in QGIS
        2. Ask the assistant to ...
    validations:
      required: true
  - type: input
    id: qgis-version
    attributes:
      label: QGIS version
      placeholder: "4.2.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "4.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Cursor
        - VS Code
        - Other
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Permission profile
      options:
        - Read-only
        - Standard
        - Full
        - Master Control
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant QGIS MCP panel activity, audit-log lines or tool output. Remove tokens and private paths.
      render: text
